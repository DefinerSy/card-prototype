<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/card-prototype/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INK & ASHES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Permanent+Marker&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/card-prototype/assets/index-Um92Phoc.js"></script>
    <link rel="stylesheet" crossorigin href="/card-prototype/assets/index-DQRXr0CZ.css">
  </head>
  <body>
    <!-- 全局 SVG 滤镜定义 -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 粗糙边缘滤镜 (撕裂纸张感) -->
        <filter id="rough-edge" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        
        <!-- 涂鸦线条抖动滤镜 -->
        <filter id="sketchy-line" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
  </body>
</html>
